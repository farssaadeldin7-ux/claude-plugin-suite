name: deploy-billing

# Deploys services/billing to Fly whenever main changes it. Requires the
# FLY_API_TOKEN repository secret (an app-scoped deploy token:
#   fly tokens create deploy --app plugin-suite-billing
# pasted into Settings -> Secrets and variables -> Actions). Until that secret
# exists (or if it is invalid for CI deploys), the workflow skips with a
# warning instead of failing, so merging this file is safe before the token is
# set up.
#
# Pull requests into main already run the full validate workflow as a required
# check, so anything landing here has passed the whole test suite.

on:
  push:
    branches: [main]
    paths:
      - 'services/billing/**'
      - '.github/workflows/deploy-billing.yml'
  workflow_dispatch:

concurrency:
  group: deploy-billing
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Check for the deploy token
        id: token
        run: |
          if [ -n "$FLY_API_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::FLY_API_TOKEN secret is not set — skipping the deploy. Create one with 'fly tokens create deploy --app plugin-suite-billing' and add it under Settings -> Secrets and variables -> Actions."
          fi
      - uses: actions/checkout@v5
        if: steps.token.outputs.present == 'true'
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.token.outputs.present == 'true'
      - name: Deploy to Fly
        if: steps.token.outputs.present == 'true'
        working-directory: services/billing
        # A Fly token is one continuous line, but pasting it from a wrapped
        # terminal can smuggle newlines into the secret and Fly then rejects
        # it as "no verified tokens" — strip them before use.
        run: |
          FLY_API_TOKEN="$(printf '%s' "$FLY_API_TOKEN" | tr -d '\r\n')"
          export FLY_API_TOKEN
          set +e
          deploy_output="$(flyctl deploy --remote-only 2>&1)"
          deploy_status=$?
          set -e
          printf '%s\n' "$deploy_output"
          if [ "$deploy_status" -ne 0 ]; then
            if printf '%s' "$deploy_output" | grep -qiE 'invalid token|no verified tokens|missing third-party discharge token'; then
              echo "::warning::FLY_API_TOKEN is invalid for CI deploys (for example, not an app-scoped deploy token). Skipping deploy. Regenerate with 'fly tokens create deploy --app plugin-suite-billing' and update the repository secret."
              exit 0
            fi
            exit "$deploy_status"
          fi

name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Validate marketplace and plugins
        run: node scripts/validate.mjs
      - name: Regression check — validate.mjs catches a plugin missing .mcp.json
        run: node test/validate-mcp-json.test.mjs
      - name: ESM module-type compatibility (real Node 20.x, not this runner's)
        run: node test/esm-compat.test.mjs
      - name: Billing service end-to-end tests
        run: node services/billing/test/e2e.mjs
      - name: Shared runtime tests
        run: |
          node packages/suite-runtime/test/mcp-lite.test.mjs
          node packages/suite-runtime/test/license-client.test.mjs
          node packages/suite-runtime/test/local-store.test.mjs
      - name: Plugin domain-logic tests
        run: |
          # Every plugin test file runs — globbed so a new test can never be
          # silently left out of CI the way an enumerated list allows.
          set -e
          for f in plugins/*/mcp/test/*.test.mjs; do
            echo "== $f"
            node "$f"
          done
          node test/plugin-table-lookups.test.mjs
          node test/build.test.mjs
      - name: Tool behaviour probe (every server, every numeric argument)
        run: node test/tool-behaviour.test.mjs
      - name: Environment validation
        run: node services/billing/test/env.test.mjs
      - name: Secret hygiene
        run: node test/secrets.test.mjs
      - name: Dependency and licence audit
        run: |
          node test/sbom.test.mjs
          node scripts/sbom.mjs --check
      - name: Release tooling tests
        run: node test/bake-billing-url.test.mjs
      - name: Check regression-test coverage of tracked defect fixes
        run: |
          node test/check-regressions.test.mjs
          node scripts/check-regressions.mjs
      - name: Check vendored runtime is in sync
        run: |
          node scripts/vendor-runtime.mjs
          # `git diff` alone only reports changes to files git already tracks —
          # a shared runtime file added since the last vendoring pass would
          # copy out as a brand-new, untracked file in every plugin's mcp/
          # directory, and `git diff --exit-code` would see nothing and pass.
          # `git status --porcelain` reports untracked files too.
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::vendored runtime is stale — run scripts/vendor-runtime.mjs and commit"
            git status --porcelain
            exit 1
          fi
      - name: Build archives
        run: node scripts/build.mjs
      # Reads what a customer receives: no secret inside an archive, and on a
      # tagged release, no placeholder billing host either.
      - name: What the archives actually ship
        run: node test/shipped-artifacts.test.mjs
        env:
          RELEASE: ${{ github.ref_type == 'tag' && '1' || '0' }}

name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate marketplace and plugins
        run: node scripts/validate.mjs
      - name: Check vendored runtime is in sync
        run: |
          node scripts/vendor-runtime.mjs
          git diff --exit-code || (echo "::error::vendored runtime is stale — run scripts/vendor-runtime.mjs and commit" && exit 1)
      - name: Build archives
        run: node scripts/build.mjs
